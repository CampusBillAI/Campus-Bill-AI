<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吃土账单分析 · 数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #c9e8ff;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(0, 80, 160, 0.35), transparent 60%),
                radial-gradient(ellipse at 50% -20%, rgba(0, 120, 200, 0.25), transparent 55%),
                #050b1f;
        }

        /* ============ 头部 ============ */
        header {
            position: relative;
            height: 8vh;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='80'><path d='M0 78 L300 78 L340 20 L860 20 L900 78 L1200 78' fill='none' stroke='%231e90ff' stroke-width='1.5' opacity='0.5'/></svg>") center bottom / 100% 100% no-repeat;
        }
        header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffffff 30%, #5cc8ff 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(0, 180, 255, 0.35);
        }
        .show-time {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #7fb8e6;
        }

        /* ============ 主体布局 ============ */
        .mainbox {
            height: 92vh;
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            gap: 16px;
            padding: 12px 16px 16px;
        }
        .column {
            display: grid;
            gap: 16px;
            min-height: 0;
        }
        .column.left  { grid-template-rows: 1fr 1fr; }
        .column.right { grid-template-rows: 0.85fr 1.15fr; }
        .column.center { position: relative; min-height: 0; }

        /* ============ 卡片（带科技感四角） ============ */
        .panel {
            position: relative;
            background: linear-gradient(180deg, rgba(16, 42, 88, 0.55), rgba(8, 20, 48, 0.65));
            border: 1px solid rgba(64, 158, 255, 0.35);
            box-shadow: inset 0 0 30px rgba(0, 120, 220, 0.12);
            padding: 10px 14px 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel::before, .panel::after,
        .panel .corner-tl, .panel .corner-br {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #00d4ff;
            border-style: solid;
        }
        .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        .panel .corner-tl { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .panel .corner-br { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #9fd8ff;
            padding-left: 12px;
            margin-bottom: 6px;
            position: relative;
            flex: none;
        }
        .panel h2::before {
            content: "";
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 16px;
            background: linear-gradient(180deg, #00d4ff, #1e6dff);
            box-shadow: 0 0 8px #00d4ff;
        }
        .chart { flex: 1; min-height: 0; }

        /* ============ 中间 3D 地球 ============ */
        #globe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .center-title {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }
        .center-title .main {
            font-size: 22px;
            letter-spacing: 8px;
            color: #bfe6ff;
            text-shadow: 0 0 18px rgba(0, 180, 255, 0.6);
        }
        .center-title .sub {
            margin-top: 6px;
            font-size: 13px;
            letter-spacing: 4px;
            color: #5a8fc0;
        }

        /* ============ 右上：总支出大数字 ============ */
        .total-card {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .total-label {
            font-size: 17px;
            letter-spacing: 6px;
            color: #7fb8e6;
            margin-bottom: 18px;
        }
        .total-number {
            font-size: 56px;
            font-weight: 800;
            font-family: "DIN Alternate", "Arial", sans-serif;
            letter-spacing: 2px;
            color: #ffd34e;
            text-shadow: 0 0 30px rgba(255, 190, 60, 0.55);
            line-height: 1.1;
            word-break: break-all;
        }
        .total-unit {
            font-size: 20px;
            font-weight: 400;
            margin-left: 8px;
            color: #ffb84e;
        }
        .total-tip {
            margin-top: 18px;
            font-size: 13px;
            color: #5a8fc0;
            letter-spacing: 2px;
        }
        .total-tip b { color: #ff8a8a; }

        /* ============ 加载 / 错误提示 ============ */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a8fc0;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header>
        <h1>吃土账单分析 · 数据大屏</h1>
        <div class="show-time"></div>
    </header>

    <!-- 页面主体 -->
    <section class="mainbox">
        <!-- 左侧：柱形图 + 折线图 -->
        <div class="column left">
            <div class="panel">
                <span class="corner-tl"></span><span class="corner-br"></span>
                <h2>支出分类柱形图</h2>
                <div id="barChart" class="chart"></div>
            </div>
            <div class="panel">
                <span class="corner-tl"></span><span class="corner-br"></span>
                <h2>每日消费趋势</h2>
                <div id="lineChart" class="chart"></div>
            </div>
        </div>

        <!-- 中间：3D 地球背景装饰 -->
        <div class="column center">
            <canvas id="globe"></canvas>
            <div class="center-title">
                <div class="main">我的钱都去哪了</div>
                <div class="sub">PERSONAL EXPENSE DASHBOARD</div>
            </div>
        </div>

        <!-- 右侧：总支出 + 环饼图 -->
        <div class="column right">
            <div class="panel total-card">
                <span class="corner-tl"></span><span class="corner-br"></span>
                <div class="total-label">累计总支出</div>
                <div>
                    <span id="totalNumber" class="total-number">--</span><span class="total-unit">元</span>
                </div>
                <div class="total-tip">数据来源：bill.csv · 共统计 <b id="dayCount">--</b> 天</div>
            </div>
            <div class="panel">
                <span class="corner-tl"></span><span class="corner-br"></span>
                <h2>消费占比环饼图</h2>
                <div id="pieChart" class="chart"></div>
            </div>
        </div>
    </section>

    <script>
        /* ================= 顶部时钟 ================= */
        (function time() {
            var dt = new Date();
            function p(n) { return n < 10 ? '0' + n : n; }
            document.querySelector('.show-time').innerHTML =
                '当前时间：' + dt.getFullYear() + '年' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' +
                p(dt.getHours()) + ':' + p(dt.getMinutes()) + ':' + p(dt.getSeconds());
            setTimeout(time, 1000);
        })();

        /* ================= ECharts 初始化 ================= */
        var barChart = echarts.init(document.getElementById('barChart'));
        var lineChart = echarts.init(document.getElementById('lineChart'));
        var pieChart = echarts.init(document.getElementById('pieChart'));

        // 三个分类统一配色
        var CATEGORIES = [
            { name: '餐饮', key: 'food_expense',     color: '#00e5cc' },
            { name: '购物', key: 'shopping_expense', color: '#ffb03a' },
            { name: '娱乐', key: 'fun_expense',      color: '#ff5e8a' }
        ];

        // 计算某个分类字典的总金额
        function sumDict(dict) {
            return Object.keys(dict || {}).reduce(function (s, k) { return s + dict[k]; }, 0);
        }

        // 数字滚动动画
        function countUp(el, target, duration) {
            duration = duration || 1200;
            var start = 0, begin = Date.now();
            (function step() {
                var p = Math.min((Date.now() - begin) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = (start + (target - start) * eased).toFixed(2);
                if (p < 1) requestAnimationFrame(step);
                else el.textContent = target.toFixed(2);
            })();
        }

        /* ================= 拉取后端数据并渲染 ================= */
        fetch('http://127.0.0.1:5000/')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.status !== 'success') throw new Error(data.message || '后端返回异常');

                // ---- 各分类汇总金额 ----
                var totals = CATEGORIES.map(function (c) {
                    return { name: c.name, value: Math.round(sumDict(data[c.key]) * 100) / 100, color: c.color };
                });

                // ---- 总支出大数字 ----
                countUp(document.getElementById('totalNumber'), data.total_expense || 0);
                document.getElementById('dayCount').textContent = Object.keys(data.daily_expense || {}).length;

                /* ---------- 左上：分类柱形图 ---------- */
                barChart.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                        valueFormatter: function (v) { return v + ' 元'; } },
                    grid: { left: '8%', right: '6%', top: '12%', bottom: '10%' },
                    xAxis: {
                        type: 'category',
                        data: totals.map(function (t) { return t.name; }),
                        axisLine: { lineStyle: { color: '#2b5a8f' } },
                        axisTick: { show: false },
                        axisLabel: { color: '#9fd8ff', fontSize: 14 }
                    },
                    yAxis: {
                        type: 'value',
                        name: '元',
                        nameTextStyle: { color: '#5a8fc0' },
                        splitLine: { lineStyle: { color: 'rgba(64,158,255,0.12)' } },
                        axisLabel: { color: '#5a8fc0' }
                    },
                    series: [{
                        type: 'bar',
                        barWidth: '42%',
                        data: totals.map(function (t) {
                            return {
                                value: t.value,
                                itemStyle: {
                                    borderRadius: [6, 6, 0, 0],
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: t.color },
                                        { offset: 1, color: 'rgba(10,40,90,0.3)' }
                                    ]),
                                    shadowColor: t.color,
                                    shadowBlur: 14
                                }
                            };
                        }),
                        label: { show: true, position: 'top', color: '#c9e8ff',
                            formatter: function (p) { return p.value + ' 元'; } }
                    }]
                });

                /* ---------- 左下：每日消费趋势折线图 ---------- */
                var daily = data.daily_expense || {};
                var dates = Object.keys(daily).sort();
                var shortDates = dates.map(function (d) { return d.length >= 10 ? d.substring(5) : d; });
                var values = dates.map(function (d) { return Math.round(daily[d] * 100) / 100; });

                lineChart.setOption({
                    tooltip: { trigger: 'axis',
                        valueFormatter: function (v) { return v + ' 元'; } },
                    grid: { left: '9%', right: '5%', top: '14%', bottom: '12%' },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: shortDates,
                        axisLine: { lineStyle: { color: '#2b5a8f' } },
                        axisLabel: { color: '#5a8fc0', fontSize: 11, rotate: dates.length > 10 ? 35 : 0 }
                    },
                    yAxis: {
                        type: 'value',
                        name: '元',
                        nameTextStyle: { color: '#5a8fc0' },
                        splitLine: { lineStyle: { color: 'rgba(64,158,255,0.12)' } },
                        axisLabel: { color: '#5a8fc0' }
                    },
                    series: [{
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 7,
                        data: values,
                        itemStyle: { color: '#00d4ff' },
                        lineStyle: { width: 2.5, color: '#00d4ff', shadowColor: '#00d4ff', shadowBlur: 10 },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0,212,255,0.45)' },
                                { offset: 1, color: 'rgba(0,212,255,0.02)' }
                            ])
                        }
                    }]
                });

                /* ---------- 右下：消费占比环饼图 ---------- */
                pieChart.setOption({
                    tooltip: { trigger: 'item',
                        formatter: function (p) { return p.name + '：' + p.value + ' 元 (' + p.percent + '%)'; } },
                    legend: { bottom: '2%', left: 'center',
                        textStyle: { color: '#9fd8ff' }, itemWidth: 12, itemHeight: 12 },
                    color: totals.map(function (t) { return t.color; }),
                    series: [{
                        type: 'pie',
                        radius: ['42%', '66%'],
                        center: ['50%', '46%'],
                        avoidLabelOverlap: true,
                        itemStyle: { borderColor: '#050b1f', borderWidth: 2 },
                        label: { color: '#c9e8ff', formatter: '{b}\n{d}%', fontSize: 12 },
                        labelLine: { lineStyle: { color: '#3a7bb5' } },
                        emphasis: {
                            scaleSize: 8,
                            label: { fontSize: 15, fontWeight: 'bold' },
                            itemStyle: { shadowBlur: 20, shadowColor: 'rgba(0,212,255,0.5)' }
                        },
                        data: totals.map(function (t) { return { name: t.name, value: t.value }; })
                    }]
                });
            })
            .catch(function (err) {
                document.getElementById('totalNumber').textContent = '0.00';
                document.getElementById('dayCount').textContent = '0';
                var tip = '连接后端失败：请确认 app.py 已启动 (http://127.0.0.1:5000)';
                ['barChart', 'lineChart', 'pieChart'].forEach(function (id) {
                    var dom = document.getElementById(id);
                    var d = document.createElement('div');
                    d.className = 'loading';
                    d.textContent = tip;
                    dom.appendChild(d);
                });
                console.error(err);
            });

        // 自适应窗口
        window.addEventListener('resize', function () {
            barChart.resize();
            lineChart.resize();
            pieChart.resize();
        });

        /* ================= 中间 3D 粒子地球（纯 Canvas） ================= */
        (function globe() {
            var canvas = document.getElementById('globe');
            var ctx = canvas.getContext('2d');
            var W, H, CX, CY, R;
            var points = [];
            var angle = 0;

            function resize() {
                var rect = canvas.parentElement.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                W = rect.width; H = rect.height;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                CX = W / 2;
                CY = H / 2;
                R = Math.min(W, H) * 0.36;
            }

            // 斐波那契球面均匀取点
            var N = 700;
            for (var i = 0; i < N; i++) {
                var phi = Math.acos(1 - 2 * (i + 0.5) / N);
                var theta = Math.PI * (1 + Math.sqrt(5)) * i;
                points.push({
                    x: Math.sin(phi) * Math.cos(theta),
                    y: Math.cos(phi),
                    z: Math.sin(phi) * Math.sin(theta)
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                angle += 0.0022;
                var cosA = Math.cos(angle), sinA = Math.sin(angle);

                // 外圈光晕
                var glow = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 1.25);
                glow.addColorStop(0, 'rgba(0,120,220,0.18)');
                glow.addColorStop(1, 'rgba(0,120,220,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(CX, CY, R * 1.25, 0, Math.PI * 2);
                ctx.fill();

                // 旋转的轨道环 1
                ctx.save();
                ctx.translate(CX, CY);
                ctx.rotate(angle * 0.6);
                ctx.strokeStyle = 'rgba(0,212,255,0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(0, 0, R * 1.18, R * 0.42, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 反向旋转的轨道环 2
                ctx.save();
                ctx.translate(CX, CY);
                ctx.rotate(-angle * 0.4 + 0.8);
                ctx.strokeStyle = 'rgba(110,170,255,0.18)';
                ctx.beginPath();
                ctx.ellipse(0, 0, R * 1.3, R * 0.55, 0, 0, Math.PI * 2);
                ctx.stroke();
                // 环上的小卫星
                var satA = -angle * 0.4 + 0.8;
                var sx = Math.cos(angle * 1.5) * R * 1.3;
                var sy = Math.sin(angle * 1.5) * R * 0.55;
                var sr = sx * Math.cos(satA) - sy * Math.sin(satA);
                var si = sx * Math.sin(satA) + sy * Math.cos(satA);
                ctx.fillStyle = '#7fd8ff';
                ctx.shadowColor = '#00d4ff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(sr, si, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();

                // 球面点阵
                for (var i = 0; i < points.length; i++) {
                    var p = points[i];
                    // 绕 Y 轴旋转
                    var x = p.x * cosA + p.z * sinA;
                    var z = -p.x * sinA + p.z * cosA;
                    var y = p.y;

                    var px = CX + x * R;
                    var py = CY + y * R;
                    var depth = (z + 1) / 2;           // 0=背面 1=正面
                    var alpha = 0.08 + depth * 0.85;
                    var size = 0.6 + depth * 1.4;

                    if (z > -0.15) {
                        ctx.fillStyle = 'rgba(80,200,255,' + alpha.toFixed(3) + ')';
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                requestAnimationFrame(draw);
            }

            resize();
            window.addEventListener('resize', resize);
            draw();
        })();
    </script>
</body>
</html>
